version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      # Agrupa las actualizaciones menores para reducir el ruido de PRs.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check solo admite TypeScript 5 y 6. Quitar cuando Astro soporte la 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Los tipos deben coincidir con el Node que se usa (24 en la CI y en Cloudflare).
      # Subirlos solo junto con la versión de Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
