name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  verify:
    name: Lint, tests, build y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Auditoría de dependencias (excepciones en web/audit-exceptions.json)
        run: npm run audit:deps
      - run: npm run lint
      - run: npm run format:check
      - name: Tests unitarios y validación del contenido
        run: npm test
      - name: Verificación de tipos y build
        run: npm run build

      - run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (flujos, CSP y accesibilidad)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
