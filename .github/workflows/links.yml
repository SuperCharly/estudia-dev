# Revisa semanalmente que los enlaces del catálogo y de las lecciones sigan funcionando.
name: Enlaces

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verificar enlaces
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --accept 200,429 'content/**/*.md' 'catalog/books.json'
          fail: false
      - name: Abrir un issue si hay enlaces rotos
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Enlaces rotos detectados
          content-filepath: ./lychee/out.md
          labels: contenido, enlaces
