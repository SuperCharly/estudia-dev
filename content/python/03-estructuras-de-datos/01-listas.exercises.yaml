exercises:
  - id: primero-y-ultimo
    type: python
    title: Primero y último
    difficulty: 1
    prompt: >-
      Lee una línea de palabras separadas por espacios y muestra la primera palabra en una
      línea y la última en otra. Con `sol luna estrella` se muestra `sol` y luego `estrella`.
    stdin: ['sol luna estrella']
    starterCode: |
      palabras = input().split()
    solution: |
      palabras = input().split()
      print(palabras[0])
      print(palabras[-1])
    hints:
      - El primer elemento tiene índice `0`.
      - 'El índice `-1` es el último elemento, sin importar el tamaño de la lista.'
    mistakes:
      - |
        palabras = input().split()
        print(palabras[0])
        print(palabras[2])
    tests: |
      for linea in ["sol luna estrella", "uno dos", "a b c d e f", "solo"]:
          palabras = linea.split()
          lineas = ejecutar_con([linea]).splitlines()[1:]
          assert lineas == [palabras[0], palabras[-1]], f"Con '{linea}' se esperaba {[palabras[0], palabras[-1]]} y se obtuvo {lineas}."

  - id: estadisticas
    type: python
    title: Estadísticas rápidas
    difficulty: 2
    prompt: >-
      Lee una línea de números enteros separados por espacios y muestra, en tres líneas:
      `Mínimo: x`, `Máximo: y` y `Promedio: z` (el promedio con 2 decimales).
    stdin: ['4 8 15 16 23 42']
    starterCode: |
      numeros = [int(x) for x in input().split()]
    solution: |
      numeros = [int(x) for x in input().split()]
      print(f"Mínimo: {min(numeros)}")
      print(f"Máximo: {max(numeros)}")
      print(f"Promedio: {sum(numeros) / len(numeros):.2f}")
    hints:
      - Usa `min()`, `max()`, `sum()` y `len()`.
      - 'Para dos decimales en una f-string: `{valor:.2f}`.'
    mistakes:
      - |
        numeros = [int(x) for x in input().split()]
        print(f"Mínimo: {numeros[0]}")
        print(f"Máximo: {numeros[-1]}")
        print(f"Promedio: {sum(numeros) / len(numeros):.2f}")
    tests: |
      for linea in ["4 8 15 16 23 42", "7", "10 -5 3", "1 2"]:
          n = [int(x) for x in linea.split()]
          esperado = [f"Mínimo: {min(n)}", f"Máximo: {max(n)}", f"Promedio: {sum(n) / len(n):.2f}"]
          lineas = ejecutar_con([linea]).splitlines()[1:]
          assert lineas == esperado, f"Con '{linea}' se esperaba {esperado} y se obtuvo {lineas}."

  - id: lista-de-compras
    type: python
    title: Lista de compras
    difficulty: 2
    prompt: >-
      Modifica la lista `compras` con métodos de lista, en este orden: agrega `pan` al
      final, elimina `leche`, inserta `café` al principio y cambia `huevos` por `huevos
      orgánicos` (sin escribir la lista completa de nuevo). Al final muestra la lista.
    starterCode: |
      compras = ["leche", "huevos", "arroz"]
    solution: |
      compras = ["leche", "huevos", "arroz"]
      compras.append("pan")
      compras.remove("leche")
      compras.insert(0, "café")
      compras[compras.index("huevos")] = "huevos orgánicos"
      print(compras)
    hints:
      - '`append` agrega al final; `insert(0, valor)`, al principio.'
      - '`remove("leche")` elimina ese valor.'
      - 'Para reemplazar, asigna a una posición: `compras[i] = "nuevo"`. `compras.index("huevos")` te da la posición.'
    tests: |
      esperado = ["café", "huevos orgánicos", "arroz", "pan"]
      assert compras == esperado, f"La lista final debería ser {esperado} y es {compras}."
      assert salida.strip() == str(esperado), "Muestra la lista final con print(compras)."
      assert codigo.count("[") <= 2, "Usa los métodos de lista en lugar de escribir la lista completa de nuevo."

  - id: segundo-mayor
    type: python
    title: El segundo mayor
    difficulty: 3
    prompt: >-
      Lee una línea de números enteros y muestra el segundo valor más grande que sea
      distinto del máximo. Con `5 9 9 3` debe mostrar `5`. Si todos los números son iguales,
      muestra `No existe`.
    stdin: ['5 9 9 3']
    starterCode: |
      numeros = [int(x) for x in input().split()]
    solution: |
      numeros = [int(x) for x in input().split()]
      maximo = max(numeros)
      menores = [n for n in numeros if n != maximo]
      if menores:
          print(max(menores))
      else:
          print("No existe")
    hints:
      - Primero encuentra el máximo.
      - Luego busca el mayor entre los números que son distintos del máximo.
      - '¿Qué pasa con `sorted(numeros)[-2]` si el máximo aparece dos veces?'
    mistakes:
      - |
        numeros = [int(x) for x in input().split()]
        print(sorted(numeros)[-2])
    tests: |
      casos = [("5 9 9 3", "5"), ("1 2 3", "2"), ("7 7 7", "No existe"), ("-1 -5 -1", "-5"), ("10 4", "4")]
      for linea, esperado in casos:
          obtenido = ultima_linea(ejecutar_con([linea]))
          assert obtenido == esperado, f"Con '{linea}' se esperaba '{esperado}' y se mostró '{obtenido}'."

  - id: rebanada
    type: quiz
    title: Rebanadas
    difficulty: 1
    prompt: 'Si `numeros = [10, 20, 30, 40, 50]`, ¿qué es `numeros[1:3]`?'
    options:
      - '[10, 20, 30]'
      - '[20, 30]'
      - '[20, 30, 40]'
      - '[10, 20]'
    answer: 1
    explanation: 'La rebanada empieza en el índice 1 (`20`) y termina antes del índice 3, así que incluye `20` y `30`.'

  - id: alias
    type: quiz
    title: Dos nombres, una lista
    difficulty: 2
    prompt: '¿Qué muestra `a = [1, 2]`, luego `b = a`, luego `b.append(3)` y finalmente `print(a)`?'
    options:
      - '[1, 2]'
      - '[1, 2, 3]'
      - '[3]'
      - 'Un error'
    answer: 1
    explanation: '`b = a` no copia la lista: ambos nombres apuntan a la misma. Al modificarla con `b`, el cambio también se ve con `a`.'
