    solution: |
      def leer_gasto(linea):
          partes = linea.split()
          if len(partes) != 2:
              raise ValueError(f"Formato incorrecto: {linea!r}")
          categoria, texto = partes
          monto = float(texto)
          if monto <= 0:
              raise ValueError("El monto debe ser positivo")
          return categoria, monto


      def procesar(lineas):
          gastos = []
          errores = []
          for numero, linea in enumerate(lineas, start=1):
              try:
                  gastos.append(leer_gasto(linea))
              except ValueError:
                  errores.append(numero)
          return gastos, errores


      def totales_por_categoria(gastos):
          totales = {}
          for categoria, monto in gastos:
              totales[categoria] = totales.get(categoria, 0) + monto
          return totales


      # Programa principal
      lineas = []
      linea = input()
      while linea != "fin":
          lineas.append(linea)
          linea = input()

      gastos, errores = procesar(lineas)
      totales = totales_por_categoria(gastos)
      for categoria in sorted(totales):
          print(f"{categoria}: {totales[categoria]:.2f}")
      print(f"Total: {sum(totales.values()):.2f}")
      print(f"Líneas con error: {len(errores)}")
    hints:
      - Lee con un `while` hasta encontrar `fin`, guardando cada línea en la lista.
      - Llama a `procesar` y pasa los gastos obtenidos a `totales_por_categoria`.
      - '`sorted(totales)` da las categorías en orden alfabético y `{valor:.2f}` muestra dos decimales.'
      - El total general es `sum(totales.values())`.
    mistakes:
