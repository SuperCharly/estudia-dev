                try:
                    gastos.append(leer_gasto(linea))
                except ValueError:
                    errores.append(numero)
            return gastos, errores


        def totales_por_categoria(gastos):
            totales = {}
            for categoria, monto in gastos:
                totales[categoria] = totales.get(categoria, 0) + monto
            return totales


        lineas = []
        linea = input()
        while linea != "fin":
            lineas.append(linea)
            linea = input()

        gastos, errores = procesar(lineas)
        totales = totales_por_categoria(gastos)
        for categoria in totales:
            print(f"{categoria}: {totales[categoria]}")
        print(f"Total: {sum(totales.values())}")
        print(f"Líneas con error: {len(errores)}")
      - |
        print("comida: 75.50")
        print("transporte: 12.00")
        print("Total: 87.50")
        print("Líneas con error: 2")
    tests: |
      def informe(entradas):
          lineas = ejecutar_con(entradas).splitlines()
          return lineas[len(entradas):]

      casos = [
          (["comida 45.50", "transporte 12", "comida 30", "cine", "ocio -5", "fin"],
           ["comida: 75.50", "transporte: 12.00", "Total: 87.50", "Líneas con error: 2"]),
          (["luz 100", "agua 20.5", "fin"],
           ["agua: 20.50", "luz: 100.00", "Total: 120.50", "Líneas con error: 0"]),
          (["fin"], ["Total: 0.00", "Líneas con error: 0"]),
          (["nada", "fin"], ["Total: 0.00", "Líneas con error: 1"]),
      ]
      for entradas, esperado in casos:
          obtenido = informe(entradas)
          assert obtenido == esperado, f"Con las entradas {entradas} se esperaba el informe {esperado} y se obtuvo {obtenido}."

  - id: ampliar-proyecto
    type: manual
    title: Amplía tu registro de gastos
    difficulty: 3
    prompt: >-
      Ahora el proyecto es tuyo. Copia el programa completo a un archivo en tu computadora
      (o sigue en el editor del ejercicio anterior) y agrégale al menos dos mejoras. Cuando
      termines, revisa la lista y marca el ejercicio como completado.
    checklist:
      - Agregué una función nueva con su docstring y sus anotaciones de tipo (por ejemplo, el gasto más alto o el promedio por categoría).
      - Usé al menos un módulo de la biblioteca estándar (por ejemplo, `statistics` para la media o `datetime` para la fecha del informe).
      - Mi programa no se detiene con ningún dato incorrecto y le explica al usuario qué línea falló.
      - Las funciones que calculan no usan `input` ni `print`.
      - Probé el programa con una entrada vacía, con una sola línea y con varias líneas incorrectas.
