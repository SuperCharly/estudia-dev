title: Biblioteca
description: >-
  Una biblioteca de barrio con `autores`, `libros`, `socios` y `prestamos`. Un préstamo
  sin `fecha_devolucion` sigue activo. En los ejercicios, "hoy" es el `2025-10-06`.
sql: |
  CREATE TABLE autores (
    id     INTEGER PRIMARY KEY,
    nombre TEXT NOT NULL,
    pais   TEXT
  );

  INSERT INTO autores (id, nombre, pais) VALUES
    (1, 'Gabriel García Márquez', 'Colombia'),
    (2, 'Isabel Allende',         'Chile'),
    (3, 'Jorge Luis Borges',      'Argentina'),
    (4, 'Julio Cortázar',         'Argentina'),
    (5, 'Rosario Castellanos',    'México'),
    (6, 'Juan Rulfo',             'México'),
    (7, 'Octavio Paz',            'México');

  CREATE TABLE libros (
    id         INTEGER PRIMARY KEY,
    titulo     TEXT NOT NULL,
    autor_id   INTEGER NOT NULL REFERENCES autores (id),
    genero     TEXT NOT NULL,
    anio       INTEGER,
    ejemplares INTEGER NOT NULL DEFAULT 1 CHECK (ejemplares >= 1)
  );

  INSERT INTO libros (id, titulo, autor_id, genero, anio, ejemplares) VALUES
    (1,  'Cien años de soledad',               1, 'Novela', 1967, 3),
    (2,  'El amor en los tiempos del cólera',  1, 'Novela', 1985, 2),
    (3,  'La casa de los espíritus',           2, 'Novela', 1982, 2),
    (4,  'Ficciones',                          3, 'Cuento', 1944, 1),
    (5,  'El Aleph',                           3, 'Cuento', 1949, 2),
    (6,  'Rayuela',                            4, 'Novela', 1963, 1),
    (7,  'Bestiario',                          4, 'Cuento', 1951, 1),
    (8,  'Balún Canán',                        5, 'Novela', 1957, 1),
    (9,  'Poesía no eres tú',                  5, 'Poesía', 1972, 1),
    (10, 'Pedro Páramo',                       6, 'Novela', 1955, 2),
    (11, 'El llano en llamas',                 6, 'Cuento', 1953, 1),
    (12, 'El laberinto de la soledad',         7, 'Ensayo', 1950, 1);

  CREATE TABLE socios (
    id         INTEGER PRIMARY KEY,
    nombre     TEXT NOT NULL,
    email      TEXT UNIQUE,
    fecha_alta DATE NOT NULL DEFAULT CURRENT_DATE
  );

