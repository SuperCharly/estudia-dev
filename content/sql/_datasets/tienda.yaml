    (1,  'Lápiz HB',               'Papelería',   8.50,    120, TRUE),
    (2,  'Cuaderno profesional',   'Papelería',   45.00,   60,  TRUE),
    (3,  'Bolígrafo azul',         'Papelería',   12.00,   0,   TRUE),
    (4,  'Mochila escolar',        'Papelería',   520.00,  15,  TRUE),
    (5,  'Audífonos inalámbricos', 'Electrónica', 899.00,  25,  TRUE),
    (6,  'Mouse óptico',           'Electrónica', 249.90,  40,  TRUE),
    (7,  'Teclado mecánico',       'Electrónica', 1450.00, 8,   TRUE),
    (8,  'Cable USB-C',            'Electrónica', 99.00,   0,   FALSE),
    (9,  'Taza de cerámica',       'Hogar',       85.00,   30,  TRUE),
    (10, 'Lámpara de escritorio',  'Hogar',       675.50,  12,  TRUE),
    (11, 'Novela de misterio',     'Libros',      350.00,  5,   TRUE),
    (12, 'Atlas del mundo',        'Libros',      410.00,  0,   FALSE);

  CREATE TABLE clientes (
    id             INTEGER PRIMARY KEY,
    nombre         TEXT NOT NULL,
    email          TEXT UNIQUE,
    ciudad         TEXT,
    fecha_registro DATE NOT NULL
  );

