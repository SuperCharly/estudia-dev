title: Tienda en línea
description: >-
  Una pequeña tienda con productos, clientes y pedidos. Las tablas `productos` y
  `clientes` se usan desde el primer módulo; `pedidos` y `pedido_detalle`, a partir del
  módulo de relaciones.
sql: |
  CREATE TABLE productos (
    id        INTEGER PRIMARY KEY,
    nombre    TEXT NOT NULL,
    categoria TEXT NOT NULL,
    precio    NUMERIC(10, 2) NOT NULL CHECK (precio >= 0),
    stock     INTEGER NOT NULL DEFAULT 0 CHECK (stock >= 0),
    activo    BOOLEAN NOT NULL DEFAULT TRUE
  );

  INSERT INTO productos (id, nombre, categoria, precio, stock, activo) VALUES
    (1,  'Lápiz HB',               'Papelería',   8.50,    120, TRUE),
    (2,  'Cuaderno profesional',   'Papelería',   45.00,   60,  TRUE),
    (3,  'Bolígrafo azul',         'Papelería',   12.00,   0,   TRUE),
    (4,  'Mochila escolar',        'Papelería',   520.00,  15,  TRUE),
    (5,  'Audífonos inalámbricos', 'Electrónica', 899.00,  25,  TRUE),
    (6,  'Mouse óptico',           'Electrónica', 249.90,  40,  TRUE),
    (7,  'Teclado mecánico',       'Electrónica', 1450.00, 8,   TRUE),
    (8,  'Cable USB-C',            'Electrónica', 99.00,   0,   FALSE),
